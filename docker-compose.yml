version: "3.9"
services:
  nginx:
    image: nginx:alpine
    container_name: debug-docker_nginx_1
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - nodejs-app

  nodejs-app:
    build: ./nodejs-app
    container_name: debug-docker_nodejs-app_1
    ports:
      - "3000:3000"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: debug-docker_redis_1
    ports:
      - "6379:6379"
